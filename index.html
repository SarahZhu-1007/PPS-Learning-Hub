<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <style>
        :root {

            --secondary-color: #ffda1a;
            --bg-color: #f4f4f4;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --mytime-color: #487ad8;
            --role-color: #6b3fa0;
            --guide-color: #c0392b;

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; padding: 20px; }

        header { border-bottom: 4px solid var(--primary-color); padding-bottom: 20px; margin-bottom: 20px; }
        h1 { font-size: 24px; color: var(--primary-color); margin-bottom: 15px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 18px; border: 2px solid var(--primary-color); background: white; color: var(--primary-color); border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 13px; }
        .tab-btn.active { background: var(--primary-color); color: white; }
        .tab-btn:hover { opacity: 0.85; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .progress-bar-container { width: 100%; background: #eee; border-radius: 10px; height: 12px; overflow: hidden; margin-bottom: 5px; }
        .progress-bar { height: 100%; background: var(--secondary-color); width: 0%; transition: width 0.3s ease; }
        .stats { font-size: 14px; color: #666; margin-bottom: 15px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
        .search-box input { flex: 1; min-width: 200px; padding: 10px 15px; border: 2px solid var(--border-color); border-radius: 6px; font-size: 14px; }
        .search-box input:focus { outline: none; border-color: var(--primary-color); }
        .search-box select { padding: 10px; border: 2px solid var(--border-color); border-radius: 6px; font-size: 14px; }
        .search-count { font-size: 13px; color: #999; white-space: nowrap; }
        section { margin-bottom: 20px; }
        h2 { font-size: 17px; margin-bottom: 10px; padding-left: 10px; border-left: 4px solid var(--secondary-color); color: #444; }
        h2.mytime { border-left-color: var(--mytime-color); color: var(--mytime-color); }
        h2.role { border-left-color: var(--role-color); color: var(--role-color); }
        h2.guide { border-left-color: var(--guide-color); color: var(--guide-color); }
        ul { list-style: none; }
        li { padding: 12px 15px; border-bottom: 1px solid var(--border-color); display: flex; align-items: flex-start; gap: 12px; cursor: pointer; transition: background 0.2s; }
        li:hover { background: #fafafa; }
        li.completed { background: #f0f9eb; }
        li.completed span.item-text { text-decoration: line-through; color: #999; }
        li.hidden { display: none; }
        input[type="checkbox"] { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--primary-color); cursor: pointer; flex-shrink: 0; }
        .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; color: white; font-weight: bold; margin-left: auto; white-space: nowrap; flex-shrink: 0; }
        .tag-high { background: #e74c3c; } .tag-mid { background: #f39c12; } .tag-low { background: #27ae60; } .tag-redline { background: #c0392b; }
        .tag-mytime { background: var(--mytime-color); }
        .tag-role { background: var(--role-color); }
        .tag-guide { background: var(--guide-color); }
        .note { font-size: 12px; color: #777; margin-top: 4px; display: block; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group.full { grid-column: span 2; }
        label { font-weight: bold; font-size: 14px; }
        input, select, textarea { padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px; font-family: inherit; }
        textarea { resize: vertical; min-height: 80px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 14px; }
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-danger { background: #e74c3c; color: white; font-size: 12px; padding: 5px 10px; }
        .btn-secondary { background: #eee; color: #333; font-size: 12px; padding: 5px 10px; }
        .actions { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .record-card { border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin-bottom: 15px; background: #fafafa; }
        .record-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .record-date { font-weight: bold; color: var(--primary-color); }
        .record-tags span { font-size: 10px; background: #ddd; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
        .ref-box { background: #f0f4ff; border: 1px solid #c8d8f8; border-radius: 8px; padding: 15px; margin: 15px 0; }
        .ref-box h3 { font-size: 14px; color: var(--mytime-color); margin-bottom: 10px; }
        .ref-box.guide h3 { color: var(--guide-color); }
        .ref-box.role h3 { color: var(--role-color); }
        .ref-box table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .ref-box th, .ref-box td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
        .ref-box th { background: #e8eef8; font-weight: bold; }
        .ref-box p { font-size: 12px; margin: 5px 0; }
        .ref-box ul { margin: 5px 0 5px 15px; }
        .ref-box li { padding: 2px 0; border: none; cursor: default; }
        /* 部门对照专用样式 */
        .dept-table-container { background: #f8faff; border: 1px solid #d0e0f0; border-radius: 8px; padding: 20px; margin: 15px 0; }
        .dept-table-container h3 { font-size: 15px; color: var(--mytime-color); margin-bottom: 5px; }
        .dept-table-container .dept-subtitle { font-size: 12px; color: #888; margin-bottom: 15px; }
        .dept-table-container .dept-search-box { margin-bottom: 15px; }
        .dept-table-container .dept-search-box input { width: 100%; padding: 10px 15px; border: 2px solid var(--border-color); border-radius: 6px; font-size: 14px; }
        .dept-table-container .dept-search-box input:focus { outline: none; border-color: var(--mytime-color); }
        .dept-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .dept-table th { background: var(--mytime-color); color: white; padding: 10px 12px; text-align: left; font-weight: bold; position: sticky; top: 0; }
        .dept-table th:first-child { border-top-left-radius: 6px; }
        .dept-table th:last-child { border-top-right-radius: 6px; }
        .dept-table td { border: 1px solid #dde7f5; padding: 8px 12px; vertical-align: top; }
        .dept-table tr:hover td { background: #eef5ff; }
        .dept-table .ou-group-row td { background: #e8eef8; font-weight: bold; font-size: 14px; color: var(--mytime-color); padding: 10px 12px; border-left: 4px solid var(--mytime-color); }
        .dept-table .ou-group-row td .ou-code { font-size: 12px; color: #999; font-weight: normal; margin-left: 8px; }
        .dept-table .col-ou { white-space: nowrap; color: #999; font-size: 12px; }
        .dept-table .col-daily { font-weight: 600; color: #333; }
        .dept-table .col-mt { color: var(--mytime-color); font-weight: 500; }
        .dept-table .col-mt-dept { color: #555; }
        .dept-table .warn-cell { background: #fff3e0 !important; }
        .dept-table .warn-cell .col-daily,
        .dept-table .warn-cell .col-mt { color: #e65100; }
        .dept-warn-box { background: #fff8e1; border: 1px solid #ffe0b2; border-radius: 6px; padding: 12px 15px; margin: 15px 0; }
        .dept-warn-box h4 { font-size: 13px; color: #e65100; margin-bottom: 8px; }
        .dept-warn-box p { font-size: 12px; color: #795548; margin: 4px 0; line-height: 1.7; }
        .dept-checklist-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px dashed #e0e0e0; }
        .dept-checklist-item:last-child { border-bottom: none; }
        .dept-checklist-item input[type="checkbox"] { margin-top: 3px; }
        .dept-checklist-item label { font-weight: normal; font-size: 13px; cursor: pointer; flex: 1; }
        .dept-checklist-item .note-inline { font-size: 11px; color: #999; }
        .dept-progress { font-size: 12px; color: #666; margin-bottom: 10px; }
        footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border-color); font-size: 12px; color: #aaa; text-align: center; }
        @media (max-width: 600px) {
            .container { padding: 15px; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: span 1; }
            .tabs { flex-direction: column; }
            .dept-table { font-size: 11px; }
            .dept-table th, .dept-table td { padding: 5px 6px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏠 宜家PPS交接学习系统 v6</h1>
        <div class="tabs">
            <button class="tab-btn active" data-tab="checklist">📋 交接学习打卡</button>
            <button class="tab-btn" data-tab="role">👤 岗位职责与能力</button>
            <button class="tab-btn" data-tab="guide">📖 白皮书知识体系</button>
            <button class="tab-btn" data-tab="journal">📝 每日学习记录</button>
        </div>
    </header>

    <div id="checklist" class="tab-content active">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="🔍 搜索打卡项（如：排班、考勤、加班、部门名称、Sales...）">
            <select id="filter-section"><option value="">全部模块</option></select>
            <span class="search-count" id="search-count"></span>
        </div>
        <div class="stats">学习进度: <span id="progress-text">0/0</span></div>
        <div class="progress-bar-container"><div id="progress-bar" class="progress-bar"></div></div>
        <main id="checklist-container"></main>
    </div>

    <div id="role" class="tab-content"><div id="role-container"></div></div>
    <div id="guide" class="tab-content"><div id="guide-container"></div></div>

    <div id="journal" class="tab-content">
        <form id="journal-form" class="form-grid">
            <div class="form-group"><label>日期</label><input type="date" id="j-date" required></div>
            <div class="form-group"><label>学习时长</label>
                <select id="j-duration"><option>0.5小时</option><option>1小时</option><option selected>2小时</option><option>3小时</option><option>4小时+</option></select>
            </div>
            <div class="form-group full"><label>学习主题标签 (可多选)</label>
                <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:5px;">
                    <label style="font-weight:normal; display:flex; align-items:center; gap:4px;"><input type="checkbox" class="j-tag" value="系统操作"> 系统操作</label>
                    <label style="font-weight:normal; display:flex; align-items:center; gap:4px;"><input type="checkbox" class="j-tag" value="My Time"> My Time</label>
                    <label style="font-weight:normal; display:flex; align-items:center; gap:4px;"><input type="checkbox" class="j-tag" value="岗位职责"> 岗位职责</label>
                    <label style="font-weight:normal; display:flex; align-items:center; gap:4px;"><input type="checkbox" class="j-tag" value="白皮书"> 白皮书</label>
                    <label style="font-weight:normal; display:flex; align-items:center; gap:4px;"><input type="checkbox" class="j-tag" value="部门对照"> 部门对照</label>
                    <label style="font-weight:normal; display:flex; align-items:center; gap:4px;"><input type="checkbox" class="j-tag" value="合规学习"> 合规学习</label>
                    <label style="font-weight:normal; display:flex; align-items:center; gap:4px;"><input type="checkbox" class="j-tag" value="流程梳理"> 流程梳理</label>
                    <label style="font-weight:normal; display:flex; align-items:center; gap:4px;"><input type="checkbox" class="j-tag" value="异常处理"> 异常处理</label>
                    <label style="font-weight:normal; display:flex; align-items:center; gap:4px;"><input type="checkbox" class="j-tag" value="问题困惑"> 问题困惑</label>
                </div>
            </div>
            <div class="form-group full"><label>今日学习内容</label><textarea id="j-content" placeholder="今天学到了什么？" required></textarea></div>
            <div class="form-group"><label>涉及系统/模块</label><input type="text" id="j-system" placeholder="如：My Time排班、工时分配、HC计算、部门对照"></div>
            <div class="form-group"><label>遗留问题/明天计划</label><input type="text" id="j-tomorrow" placeholder="需要找谁确认？明天优先做什么？"></div>
            <div class="form-group full" style="align-items:flex-end;"><button type="submit" class="btn btn-primary">💾 保存今日记录</button></div>
        </form>
        <div class="actions">
            <button class="btn btn-secondary" id="export-btn">📥 导出备份 (JSON)</button>
            <button class="btn btn-secondary" id="import-btn">📤 导入备份</button>
            <input type="file" id="import-file" accept=".json" style="display:none">
        </div>
        <div id="journal-list"></div>
    </div>

    <footer>数据保存在本地浏览器 (LocalStorage) | 建议定期导出备份<br>PPS岗位价值：懂薪酬数据的HR，未来转C&B/HRIS/HRBP更有底气</footer>
</div>

/* ================= 工具函数 ================= */
function loadState(key) { try { return JSON.parse(localStorage.getItem(key)) || {}; } catch (e) { return {}; } }
function saveState(key, state) { localStorage.setItem(key, JSON.stringify(state)); }
function loadJournal() { try { return JSON.parse(localStorage.getItem(JOURNAL_KEY)) || []; } catch (e) { return []; } }
function saveJournalData(data) { localStorage.setItem(JOURNAL_KEY, JSON.stringify(data)); }

/* ================= 标签页切换 ================= */
function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(function(btn) { btn.classList.remove('active'); });
    document.querySelectorAll('.tab-content').forEach(function(content) { content.classList.remove('active'); });
    var targetBtn = document.querySelector('[data-tab="' + tabName + '"]');
    if (targetBtn) targetBtn.classList.add('active');
    var targetContent = document.getElementById(tabName);
    if (targetContent) targetContent.classList.add('active');
    if (tabName === 'journal') renderJournal();
    if (tabName === 'role') renderRoleList();
    if (tabName === 'guide') renderGuideList();
}

/* ================= 部门对照表渲染 ================= */
function renderDeptMappingTable(container) {
    var state = loadState(CHECKLIST_KEY);
    var wrapper = document.createElement('div');
    wrapper.className = 'dept-table-container';
    wrapper.innerHTML =
        '<h3>🏢 苏州门店 部门名称完整对照表</h3>' +
        '<div class="dept-subtitle">日常叫法（Organizational Unit） ⟷ My Time系统显示名称（Div_Dep）| 共10个OU、42个部门</div>' +
        '<div class="dept-search-box"><input type="text" id="dept-search" placeholder="🔍 在对照表中搜索部门名称（如：Sales、Kitchen、Management、Recovery...）"></div>' +
        '<div class="dept-progress" id="dept-progress"></div>';

    var table = document.createElement('table');
    table.className = 'dept-table';
    table.id = 'dept-mapping-table';
    table.innerHTML =
        '<thead><tr>' +
        '<th style="width:7%;">OU编号</th>' +
        '<th style="width:18%;">日常叫法<br><small style="font-weight:normal; opacity:0.8;">Organizational Unit</small></th>' +
        '<th style="width:22%;">My Time Div<br><small style="font-weight:normal; opacity:0.8;">（系统Division）</small></th>' +
        '<th style="width:22%;">My Time Dept<br><small style="font-weight:normal; opacity:0.8;">（系统Department）</small></th>' +
        '<th style="width:31%;">系统完整显示名称<br><small style="font-weight:normal; opacity:0.8;">Div \\| Dept</small></th>' +
        '</tr></thead><tbody id="dept-tbody"></tbody>';

    wrapper.appendChild(table);

    /* 易混淆提醒框 */
    var warnBox = document.createElement('div');
    warnBox.className = 'dept-warn-box';
    warnBox.innerHTML =
        '<h4>⚠️ 易混淆提醒（务必注意）</h4>' +
        '<p>1. <b>Management \\| Management</b>：多个OU都有此部门（1016 Com-In / 1023 CR / 1094 Sales / 1101 Store Mgt / 1224 Ful），My Time中显示完全相同，<b>必须通过OU编号区分</b></p>' +
        '<p>2. <b>Marketing \\| Marketing</b>：Local Marketing下 IKEA Family 和 Local Marketing 两个部门在My Time中显示相同，需通过OU 1069下的子部门区分</p>' +
        '<p>3. <b>Sales \\| Kitchen& Dining</b>：Sales下 Dining 和 Kitchen 是两个不同部门，但My Time中都显示为 Sales \\| Kitchen& Dining</p>' +
        '<p>4. <b>Safety& Security <span style="color:#e65100;">2</span></b>：Operations下 Safety& Security 部门在My Time中Dept名称带有数字"2"，注意不要遗漏</p>';
    wrapper.appendChild(warnBox);

    /* 学习打卡清单 */
    var checklistDiv = document.createElement('div');
    checklistDiv.style.marginTop = '15px';
    checklistDiv.innerHTML = '<h4 style="font-size:14px; color:var(--mytime-color); margin-bottom:10px;">✅ 部门熟记打卡（勾选已掌握的模块）</h4>';
    var deptDone = 0, deptTotal = deptChecklistItems.length;
    deptChecklistItems.forEach(function(item) {
        var isChecked = state[item.id] || false;
        if (isChecked) deptDone++;
        var div = document.createElement('div');
        div.className = 'dept-checklist-item';
        var cb = document.createElement('input');
        cb.type = 'checkbox'; cb.id = 'cb_' + item.id; cb.checked = isChecked;
        cb.onclick = function(e) { e.stopPropagation(); };
        cb.onchange = function() {
            var st = loadState(CHECKLIST_KEY);
            st[item.id] = this.checked; saveState(CHECKLIST_KEY, st);
            renderDeptMappingTable(container); // 重新渲染以更新进度
            renderChecklist(); // 更新总进度
        };
        var lbl = document.createElement('label');
        lbl.htmlFor = 'cb_' + item.id;
        lbl.textContent = item.text;
        if (isChecked) lbl.style.textDecoration = 'line-through';
        div.appendChild(cb); div.appendChild(lbl);
        checklistDiv.appendChild(div);
    });
    var deptPct = deptTotal > 0 ? Math.round((deptDone / deptTotal) * 100) : 0;
    var progressEl = document.createElement('div');
    progressEl.className = 'dept-progress';
    progressEl.innerHTML = '部门熟记进度: <b>' + deptDone + '/' + deptTotal + '</b> (' + deptPct + '%)';
    checklistDiv.appendChild(progressEl);
    wrapper.appendChild(checklistDiv);

    /* 操作技巧 */
    var tipDiv = document.createElement('div');
    tipDiv.style.cssText = 'background:#e8f5e9; border:1px solid #a5d6a7; border-radius:6px; padding:12px 15px; margin-top:15px;';
    tipDiv.innerHTML =
        '<p style="font-size:13px; color:#2e7d32;"><b>💡 操作技巧</b></p>' +
        '<p style="font-size:12px; color:#555; margin-top:5px;">在My Time中排班/考勤/Sign off时，<b>先用OU编号定位到正确的Organizational Unit</b>，再找到对应的Div_Dep部门。建议截图或打印本对照表放在工位旁，初期操作时随时对照。</p>';
    wrapper.appendChild(tipDiv);

    container.appendChild(wrapper);

    /* 填充表格行 */
    var tbody = document.getElementById('dept-tbody');
    deptMappingData.forEach(function(ou) {
        /* OU分组行 */
        var groupTr = document.createElement('tr');
        groupTr.className = 'ou-group-row';
        groupTr.innerHTML = '<td colspan="5">' + ou.ouName + ' <span class="ou-code">（OU ' + ou.ouCode + ' — ' + ou.ouLabel + '）</span></td>';
        groupTr.setAttribute('data-ou', ou.ouName);
        tbody.appendChild(groupTr);

        ou.depts.forEach(function(dept) {
            var tr = document.createElement('tr');
            if (dept.warn) tr.className = 'warn-cell';
            tr.setAttribute('data-search', (ou.ouName + ' ' + ou.ouLabel + ' ' + dept.daily + ' ' + dept.mtDiv + ' ' + dept.mtDept + ' ' + ou.ouCode).toLowerCase());
            tr.setAttribute('data-ou', ou.ouName);
            var warnIcon = dept.warn ? ' <span style="color:#e65100;" title="' + (dept.warnNote || '') + '">⚠️</span>' : '';
            var fullDisplay = dept.mtDiv + ' \\| ' + dept.mtDept;
            tr.innerHTML =
                '<td class="col-ou">' + ou.ouCode + '</td>' +
                '<td class="col-daily">' + dept.daily + warnIcon + '</td>' +
                '<td class="col-mt">' + dept.mtDiv + '</td>' +
                '<td class="col-mt-dept">' + dept.mtDept + '</td>' +
                '<td class="col-mt" style="font-family:monospace; font-size:11px; color:#888;">' + fullDisplay + '</td>';
            if (dept.warn && dept.warnNote) {
                tr.title = dept.warnNote;
            }
            tbody.appendChild(tr);
        });
    });

    /* 部门搜索功能 */
    var searchInput = document.getElementById('dept-search');
    if (searchInput) {
        searchInput.addEventListener('input', function() {
            var keyword = this.value.toLowerCase().trim();
            var rows = tbody.querySelectorAll('tr');
            var currentOU = null;
            var ouHasMatch = false;
            rows.forEach(function(row) {
                if (row.classList.contains('ou-group-row')) {
                    currentOU = row;
                    ouHasMatch = false;
                    if (keyword === '') {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none'; // 先隐藏，有匹配项时再显示
                    }
                } else {
                    if (keyword === '') {
                        row.style.display = '';
                    } else {
                        var searchText = row.getAttribute('data-search') || '';
                        if (searchText.indexOf(keyword) !== -1) {
                            row.style.display = '';
                            ouHasMatch = true;
                            if (currentOU) currentOU.style.display = '';
                        } else {
                            row.style.display = 'none';
                        }
                    }
                }
            });
        });
    }
}

/* ================= 通用列表渲染 ================= */
function renderList(data, containerId, stateKey, isChecklist) {
    var state = loadState(stateKey);
    var container = document.getElementById(containerId);
    container.innerHTML = '';
    var total = 0, done = 0;

    if (isChecklist) {
        var filterSelect = document.getElementById('filter-section');
        if (filterSelect && filterSelect.options.length <= 1) {
            data.forEach(function(section) {
                var opt = document.createElement('option');
                opt.value = section.category || section.title;
                opt.textContent = section.title;
                filterSelect.appendChild(opt);
            });
        }
    }

    data.forEach(function(section) {
        var secEl = document.createElement('section');
        secEl.setAttribute('data-category', section.category || '');
        secEl.setAttribute('data-title', section.title);
        var h2 = document.createElement('h2');
        h2.textContent = section.title;
        if (section.title.indexOf('My Time') !== -1) h2.className = 'mytime';
        else if (section.tagType === 'role') h2.className = 'role';
        else if (section.tagType === 'guide') h2.className = 'guide';
        secEl.appendChild(h2);

        /* 特殊处理：部门对照表模块用表格形式渲染 */
        if (isChecklist && section.category === 'deptmapping') {
            secEl.appendChild(h2);
            var introP = document.createElement('p');
            introP.style.cssText = 'font-size:13px; color:#666; margin-bottom:10px; padding-left:10px;';
            introP.innerHTML = '排班、考勤、Sign off时，日常叫法和My Time系统显示名称往往不同。请对照下表逐一熟记，避免操作时找不到正确部门。';
            secEl.appendChild(introP);
            renderDeptMappingTable(secEl);
            container.appendChild(secEl);
            /* 统计部门打卡项 */
            deptChecklistItems.forEach(function(item) {
                total++;
                if (state[item.id]) done++;
            });
            return;
        }

        var ul = document.createElement('ul');
        section.items.forEach(function(item) {
            total++;
            var isChecked = state[item.id] || false;
            if (isChecked) done++;
            var li = document.createElement('li');
            if (isChecked) li.className = 'completed';
            li.setAttribute('data-search', (item.text + ' ' + (item.note || '') + ' ' + (item.tag || '')).toLowerCase());
            li.onclick = function(e) {
                if (e.target.type !== 'checkbox') {
                    var cb = li.querySelector('input[type="checkbox"]');
                    if (cb) { cb.checked = !cb.checked; toggleItem(stateKey, item.id, cb.checked, data, containerId, isChecklist); }
                }
            };
            var checkbox = document.createElement('input');
            checkbox.type = 'checkbox'; checkbox.checked = isChecked;
            checkbox.onclick = function(e) { e.stopPropagation(); };
            checkbox.onchange = function() { toggleItem(stateKey, item.id, this.checked, data, containerId, isChecklist); };
            var div = document.createElement('div');
            div.style.flex = '1';
            var span = document.createElement('span');
            span.className = 'item-text'; span.textContent = item.text;
            div.appendChild(span);
            if (item.note) { var note = document.createElement('small'); note.className = 'note'; note.textContent = '💡 ' + item.note; div.appendChild(note); }
            var tag = document.createElement('span');
            tag.className = 'tag tag-' + item.tagType; tag.textContent = item.tag;
            li.appendChild(checkbox); li.appendChild(div); li.appendChild(tag);
            ul.appendChild(li);
        });
        secEl.appendChild(ul);
        container.appendChild(secEl);
    });

    if (isChecklist) insertChecklistRefBoxes(container);
    insertGuideRefBoxes(container);

    if (isChecklist) {
        var pct = total > 0 ? Math.round((done / total) * 100) : 0;
        var ptEl = document.getElementById('progress-text');
        var pbEl = document.getElementById('progress-bar');
        if (ptEl) ptEl.textContent = done + '/' + total + ' (' + pct + '%)';
        if (pbEl) pbEl.style.width = pct + '%';
    }
}

function toggleItem(stateKey, id, checked, data, containerId, isChecklist) {
    var state = loadState(stateKey); state[id] = checked; saveState(stateKey, state);
    renderList(data, containerId, stateKey, isChecklist);
}
function renderChecklist() { renderList(checklistData, 'checklist-container', CHECKLIST_KEY, true); }
function renderRoleList() { renderList(roleData, 'role-container', CHECKLIST_KEY, false); }
function renderGuideList() { renderList(guideData, 'guide-container', CHECKLIST_KEY, false); }

/* ================= 搜索功能 ================= */
function doSearch() {
    var keyword = document.getElementById('search-input').value.toLowerCase().trim();
    var filterVal = document.getElementById('filter-section').value;
    var sections = document.querySelectorAll('#checklist-container section');
    var visibleCount = 0;
    sections.forEach(function(sec) {
        var secCat = sec.getAttribute('data-category');
        var secTitle = sec.getAttribute('data-title');
        var sectionMatched = false;
        if (filterVal && filterVal !== secCat && filterVal !== secTitle) { sec.style.display = 'none'; return; }
        sec.style.display = '';
        /* 部门对照表模块特殊处理：不隐藏，只在有搜索关键词时过滤表格行 */
        if (secCat === 'deptmapping') {
            if (keyword) {
                var deptSearch = document.getElementById('dept-search');
                if (deptSearch) { deptSearch.value = keyword; deptSearch.dispatchEvent(new Event('input')); }
            }
            sectionMatched = true; visibleCount += deptChecklistItems.length;
        } else {
            var items = sec.querySelectorAll('li');
            items.forEach(function(li) {
                var searchText = li.getAttribute('data-search') || '';
                if (keyword === '' || searchText.indexOf(keyword) !== -1) { li.classList.remove('hidden'); visibleCount++; sectionMatched = true; }
                else { li.classList.add('hidden'); }
            });
        }
        if (!sectionMatched && keyword !== '') { sec.style.display = 'none'; }
    });
    document.getElementById('search-count').textContent = keyword || filterVal ? '显示 ' + visibleCount + ' 项' : '';
}

/* ================= 每日学习记录 ================= */
function renderJournal() {
    var journal = loadJournal();
    var list = document.getElementById('journal-list');
    if (journal.length === 0) { list.innerHTML = '<p style="text-align:center; color:#999; padding:20px;">暂无记录，填写上方表单开始你的第一天吧！</p>'; return; }
    list.innerHTML = '';
    journal.forEach(function(j) {
        var card = document.createElement('div'); card.className = 'record-card';
        var header = document.createElement('div'); header.className = 'record-header';
        var dateSpan = document.createElement('span'); dateSpan.className = 'record-date'; dateSpan.textContent = j.date + ' | ' + j.duration;
        header.appendChild(dateSpan);
        var delBtn = document.createElement('button'); delBtn.className = 'btn btn-danger'; delBtn.textContent = '删除'; delBtn.onclick = function() { deleteJournal(j.id); };
        header.appendChild(delBtn); card.appendChild(header);
        if (j.tags && j.tags.length > 0) { var tagsDiv = document.createElement('div'); tagsDiv.className = 'record-tags'; j.tags.forEach(function(t) { var tagSpan = document.createElement('span'); tagSpan.textContent = t; tagsDiv.appendChild(tagSpan); }); card.appendChild(tagsDiv); }
        var contentP = document.createElement('p'); contentP.style.margin = '10px 0'; contentP.style.whiteSpace = 'pre-wrap'; contentP.textContent = j.content; card.appendChild(contentP);
        if (j.system) { var sysP = document.createElement('p'); sysP.style.cssText = 'font-size:12px; color:#666;'; sysP.textContent = '🛠️ 涉及系统：' + j.system; card.appendChild(sysP); }
        if (j.tomorrow) { var tomP = document.createElement('p'); tomP.style.cssText = 'font-size:12px; color:#666;'; tomP.textContent = '🎯 明日计划/遗留：' + j.tomorrow; card.appendChild(tomP); }
        list.appendChild(card);
    });
}

function deleteJournal(id) { if (!confirm('确认删除这条记录？')) return; var journal = loadJournal(); journal = journal.filter(function(j) { return j.id !== id; }); saveJournalData(journal); renderJournal(); }

function exportJournal() {
    var journal = loadJournal(); var dataStr = JSON.stringify(journal, null, 2);
    var blob = new Blob([dataStr], { type: 'application/json' }); var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = 'pps_journal_backup_' + new Date().toISOString().split('T')[0] + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function importJournal(event) {
    var file = event.target.files[0]; if (!file) return; var reader = new FileReader();
    reader.onload = function(e) {
        try { var data = JSON.parse(e.target.result); if (confirm('导入将覆盖当前所有记录，确认继续？')) { saveJournalData(data); renderJournal(); alert('导入成功！'); } }
        catch (err) { alert('文件格式错误，请选择正确的JSON备份文件。'); }
    };
    reader.readAsText(file); event.target.value = '';
}

/* ================= 初始化 ================= */
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('j-date').value = new Date().toISOString().split('T')[0];
    document.querySelectorAll('.tab-btn').forEach(function(btn) { btn.addEventListener('click', function() { switchTab(this.getAttribute('data-tab')); }); });
    document.getElementById('search-input').addEventListener('input', doSearch);
    document.getElementById('filter-section').addEventListener('change', doSearch);
    document.getElementById('journal-form').addEventListener('submit', function(e) {
        e.preventDefault(); var tags = [];
        document.querySelectorAll('.j-tag:checked').forEach(function(c) { tags.push(c.value); });
        var entry = { id: Date.now(), date: document.getElementById('j-date').value, duration: document.getElementById('j-duration').value, tags: tags, content: document.getElementById('j-content').value, system: document.getElementById('j-system').value, tomorrow: document.getElementById('j-tomorrow').value };
        var journal = loadJournal(); journal.unshift(entry); saveJournalData(journal);
        e.target.reset(); document.getElementById('j-date').value = new Date().toISOString().split('T')[0]; renderJournal(); alert('✅ 保存成功！');
    });
    document.getElementById('export-btn').addEventListener('click', exportJournal);
    document.getElementById('import-btn').addEventListener('click', function() { document.getElementById('import-file').click(); });
    document.getElementById('import-file').addEventListener('change', importJournal);
    renderChecklist(); renderJournal();
});
